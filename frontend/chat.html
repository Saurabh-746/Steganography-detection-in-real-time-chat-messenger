<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat</title>
  <style>
:root{--bg:#eef4ff;--panel:#fff;--accent:#2a7cf6;--muted:#666;--online:#22c55e;--system:#f59e0b}
*{box-sizing:border-box;font-family:Segoe UI,Roboto,Arial,sans-serif}
html,body{height:100%;margin:0;background:var(--bg)}
#app{display:flex;height:100vh}
.sidebar{width:260px;padding:18px;background:var(--panel);border-right:1px solid #e8eefb;display:flex;flex-direction:column}
.sidebar header{margin-bottom:10px}
.sidebar h2{margin:0 0 6px 0;font-size:18px}
.muted{color:var(--muted);font-size:13px;margin:3px 0}
.contacts{margin-top:14px;flex:1;overflow:auto}
.contacts h4{margin:0 0 8px 0;font-size:14px;color:var(--muted)}
ul{list-style:none;padding:0;margin:0}
.contact{padding:10px 8px;border-radius:6px;cursor:pointer;position:relative;border-left:3px solid transparent;transition:all 0.2s}
.contact:hover{background:#f4f8ff}
.contact.online{border-left-color:var(--online)}
.contact.online::before{content:'●';color:var(--online);margin-right:6px}
.contact.offline::before{content:'●';color:#ccc;margin-right:6px}
.contact.selected{background:var(--accent);color:#fff;border-left-color:#fff}
.contact.selected:hover{background:#1f6fd5}
.addContact{display:flex;gap:8px;margin-top:12px}
.addContact input{flex:1;padding:8px;border:1px solid #e9eef8;border-radius:6px}
.addContact button{padding:8px;border-radius:6px;background:var(--accent);color:#fff;border:none;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:14px;padding-top:10px;border-top:1px solid #eef4ff}
.actions a{color:var(--accent);text-decoration:none;padding:8px;flex:1;text-align:center;border-radius:6px;border:1px solid var(--accent)}
.actions a:hover{background:#f4f8ff}
.actions button{flex:1;padding:8px;border:1px solid #dc2626;background:#fff;color:#dc2626;border-radius:6px;cursor:pointer}
.actions button:hover{background:#fef2f2}

.chat{flex:1;display:flex;flex-direction:column}
.convHeader{padding:16px;border-bottom:1px solid #eef4ff;background:#fff;font-weight:600;text-align:center}
.messages{flex:1;padding:14px;overflow:auto;background:linear-gradient(180deg,#fbfdff,#f6f9ff)}
.msg{max-width:70%;padding:10px 12px;margin:8px 0;border-radius:12px;display:flex;flex-direction:column;gap:4px;word-wrap:break-word}
.msg.in{background:#fff;border:1px solid #eef3ff;align-self:flex-start}
.msg.out{margin-left:auto;background:var(--accent);color:#fff;align-self:flex-end}
.msg.system{background:var(--system);color:#fff;max-width:80%;margin:6px auto;text-align:center;font-size:13px;padding:6px 10px;border-radius:20px}
.msg .sender{font-weight:600;font-size:13px;opacity:0.9}
.msg.out .sender{display:none}
.msg .content{font-size:15px;line-height:1.4}
.msg .time{font-size:11px;opacity:0.7;align-self:flex-end}
.sendForm{display:flex;padding:12px;border-top:1px solid #eef4ff;background:#fff}
.sendForm input{flex:1;padding:10px 12px;border:1px solid #e9eef8;border-radius:8px;font-size:14px}
.sendForm button{margin-left:8px;padding:10px 18px;border-radius:8px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-weight:500}
.sendForm button:hover{background:#1f6fd5}
.sendForm input:disabled{background:#f5f5f5;cursor:not-allowed}
.sendForm button:disabled{background:#ccc;cursor:not-allowed}

#connectionStatus{margin-top:4px;font-size:12px;font-weight:600}
#onlineCount{color:var(--online);font-weight:600}
.typing-indicator{font-size:13px;color:var(--muted);font-style:italic;padding:8px;text-align:center}
  </style>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <header>
        <h2>Chat Room</h2>
        <div id="me" class="muted"></div>
        <div id="connectionStatus" class="muted"></div>
      </header>
      <div class="contacts">
        <h4>Online Users (<span id="onlineCount">0</span>)</h4>
        <ul id="contactsList"></ul>
      </div>
      <div class="actions">
        <a id="goRegister" href="/register.html">Register</a>
        <button id="logout">Logout</button>
      </div>
      <div id="stegoPanel" style="margin-top:14px;padding-top:12px;border-top:1px solid #eef4ff;">
        <h4 style="margin:0 0 8px 0;font-size:14px;color:var(--muted)">Image Stego Check</h4>
        <input type="file" id="stegoFile" accept="image/*" style="width:100%" />
        <button id="stegoCheckBtn" style="margin-top:8px;width:100%;padding:8px;border-radius:6px;background:var(--accent);color:#fff;border:none;cursor:pointer">Analyze Image</button>
        <div id="stegoResult" class="muted" style="margin-top:8px"></div>
      </div>
    </aside>
    <main class="chat">
      <div id="conversationHeader" class="convHeader">Select a contact to start chatting</div>
      <div id="messages" class="messages"></div>
      <form id="sendForm" class="sendForm">
        <input id="messageInput" placeholder="Type a message" autocomplete="off" disabled />
        <button id="sendBtn" disabled>Send</button>
      </form>
    </main>
  </div>

  <script>
const WS_URL = 'wss://steganography-detection-in-real-time.onrender.com';
const API_URL = 'https://steganography-detection-in-real-time.onrender.com';

document.addEventListener('DOMContentLoaded', () => {
  const currentUser = localStorage.getItem('currentUser');
  const meEl = document.getElementById('me');
  const contactsList = document.getElementById('contactsList');
  const onlineCount = document.getElementById('onlineCount');
  const messagesEl = document.getElementById('messages');
  const convHeader = document.getElementById('conversationHeader');
  const sendForm = document.getElementById('sendForm');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const logoutBtn = document.getElementById('logout');
  const connectionStatus = document.getElementById('connectionStatus');
  const stegoFile = document.getElementById('stegoFile');
  const stegoCheckBtn = document.getElementById('stegoCheckBtn');
  const stegoResult = document.getElementById('stegoResult');

  // Redirect to login if not logged in
  if (!currentUser) {
    location.href = '/login.html';
    return;
  }

  meEl.textContent = `Signed in as: ${currentUser}`;

  let ws = null;
  let reconnectAttempts = 0;
  const maxReconnectAttempts = 5;
  let selectedContact = null;
  let allUsers = [];
  let onlineUsers = [];

  // Load all registered users
  async function loadAllUsers() {
    try {
      const response = await fetch(`${API_URL}/api/users`);
      const data = await response.json();
      allUsers = data.users.map(u => u.username).filter(u => u !== currentUser);
      updateContactsList();
    } catch (error) {
      console.error('Error loading users:', error);
    }
  }

  // Connect to WebSocket
  function connectWebSocket() {
    try {
      connectionStatus.textContent = 'Connecting...';
      connectionStatus.style.color = 'orange';
      ws = new WebSocket(`${WS_URL}/ws/${currentUser}`);
      ws.onopen = () => {
        console.log('WebSocket connected');
        connectionStatus.textContent = '● Connected';
        connectionStatus.style.color = 'green';
        reconnectAttempts = 0;
        sendBtn.disabled = false;
      };
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log('Received:', data);
        if (data.type === 'message') {
          if (selectedContact && 
            ((data.sender === selectedContact && data.receiver === currentUser) ||
             (data.sender === currentUser && data.receiver === selectedContact))) {
            addMessageToUI(data);
          }
        } else if (data.type === 'user_online' || data.type === 'user_offline') {
          if (data.type === 'user_online' && !onlineUsers.includes(data.username)) {
            onlineUsers.push(data.username);
          } else if (data.type === 'user_offline') {
            onlineUsers = onlineUsers.filter(u => u !== data.username);
          }
          updateContactsList();
        } else if (data.type === 'user_list') {
          onlineUsers = data.users.filter(u => u !== currentUser);
          updateContactsList();
        } else if (data.type === 'typing') {
          if (data.sender === selectedContact) {
            showTypingIndicator(data.sender);
          }
        }
      };
      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        connectionStatus.textContent = '● Connection error';
        connectionStatus.style.color = 'red';
      };
      ws.onclose = () => {
        console.log('WebSocket disconnected');
        connectionStatus.textContent = '● Disconnected';
        connectionStatus.style.color = 'red';
        sendBtn.disabled = true;
        if (reconnectAttempts < maxReconnectAttempts) {
          reconnectAttempts++;
          setTimeout(() => {
            console.log(`Reconnecting... (${reconnectAttempts}/${maxReconnectAttempts})`);
            connectWebSocket();
          }, 2000 * reconnectAttempts);
        } else {
          connectionStatus.textContent = '● Connection failed';
          alert('Connection lost. Please refresh the page.');
        }
      };
    } catch (error) {
      console.error('Error connecting to WebSocket:', error);
      connectionStatus.textContent = '● Connection failed';
      connectionStatus.style.color = 'red';
    }
  }

  function addMessageToUI(message) {
    const div = document.createElement('div');
    div.className = 'msg ' + (message.sender === currentUser ? 'out' : 'in');
    const time = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const contentSpan = document.createElement('span');
    contentSpan.className = 'content';
    contentSpan.textContent = message.content;
    const timeSpan = document.createElement('span');
    timeSpan.className = 'time';
    timeSpan.textContent = time;
    div.appendChild(contentSpan);
    div.appendChild(timeSpan);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function loadConversationHistory(contact) {
    try {
      const response = await fetch(`${API_URL}/api/messages/${currentUser}/${contact}`);
      const data = await response.json();
      messagesEl.innerHTML = '';
      if (data.messages && data.messages.length > 0) {
        data.messages.forEach(msg => { addMessageToUI(msg); });
      }
    } catch (error) {
      console.error('Error loading conversation:', error);
    }
  }

  function updateContactsList() {
    contactsList.innerHTML = '';
    onlineCount.textContent = onlineUsers.length;
    if (allUsers.length === 0) {
      contactsList.innerHTML = '<li class="muted">No other users registered</li>';
      return;
    }
    allUsers.forEach(username => {
      const li = document.createElement('li');
      const isOnline = onlineUsers.includes(username);
      li.className = 'contact' + (isOnline ? ' online' : ' offline');
      li.textContent = username;
      li.title = isOnline ? 'Online' : 'Offline';
      if (selectedContact === username) { li.classList.add('selected'); }
      li.addEventListener('click', () => selectContact(username));
      contactsList.appendChild(li);
    });
  }

  async function selectContact(username) {
    selectedContact = username;
    convHeader.textContent = `Chat with ${username}`;
    updateContactsList();
    await loadConversationHistory(username);
    messageInput.disabled = false;
    sendBtn.disabled = false;
  }

  let typingTimeout;
  function showTypingIndicator(username) {
    if (username !== selectedContact) return;
    const existingIndicator = document.getElementById('typing-indicator');
    if (existingIndicator) {
      clearTimeout(typingTimeout);
    } else {
      const indicator = document.createElement('div');
      indicator.id = 'typing-indicator';
      indicator.className = 'typing-indicator';
      indicator.textContent = `${username} is typing...`;
      messagesEl.appendChild(indicator);
    }
    typingTimeout = setTimeout(() => {
      const indicator = document.getElementById('typing-indicator');
      if (indicator) indicator.remove();
    }, 3000);
  }

  sendForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text) return;
    if (!selectedContact) { alert('Please select a contact to chat with.'); return; }
    if (!ws || ws.readyState !== WebSocket.OPEN) { alert('Not connected to server. Please wait or refresh the page.'); return; }
    try {
      ws.send(JSON.stringify({ type: 'message', receiver: selectedContact, content: text }));
      messageInput.value = '';
    } catch (error) {
      console.error('Error sending message:', error);
      alert('Failed to send message. Please try again.');
    }
  });

  let typingIndicatorTimeout;
  messageInput.addEventListener('input', () => {
    if (!selectedContact || !ws || ws.readyState !== WebSocket.OPEN) return;
    clearTimeout(typingIndicatorTimeout);
    ws.send(JSON.stringify({ type: 'typing', receiver: selectedContact }));
    typingIndicatorTimeout = setTimeout(() => {}, 1000);
  });

  logoutBtn.addEventListener('click', () => {
    if (ws) { ws.close(); }
    localStorage.removeItem('currentUser');
    localStorage.removeItem('userInfo');
    location.href = '/login.html';
  });

  // Steganography image analysis
  stegoCheckBtn.addEventListener('click', async () => {
    const file = stegoFile.files && stegoFile.files[0];
    if (!file) { alert('Please choose an image first.'); return; }
    stegoResult.textContent = 'Analyzing...';
    try {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch(`${API_URL}/api/analyze-image`, { method: 'POST', body: form });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || 'Analysis failed');
      }
      const data = await res.json();
      const pct = Math.round((data.confidence || 0) * 100);
      if (data.safe) {
        stegoResult.innerHTML = `<span style="color:var(--online);font-weight:600">Safe</span> (${pct}% confidence)`;
      } else {
        stegoResult.innerHTML = `<span style="color:#dc2626;font-weight:600">Stego suspected</span> (${pct}% confidence)`;
      }
    } catch (e) {
      console.error(e);
      stegoResult.textContent = `Error: ${e.message}`;
    }
  });

  messageInput.disabled = true;
  sendBtn.disabled = true;
  loadAllUsers();
  connectWebSocket();

  window.addEventListener('beforeunload', () => { if (ws) { ws.close(); } });
});
  </script>
</body>
</html>
