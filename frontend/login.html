<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Login</title>
	<style>
	:root{
	  --bg: #DED9EE;       /* Lavender Tint */
	  --card: #FFFFFF;
	  --primary: #228CDC;  /* Dodger Blue */
	  --error: #B52B79;    /* Medium Violet */
	  --success: #25D366;  /* Deep Green */
	  --heading: #7B1D52;  /* Deep Purple */
	  --text: #222222;     /* main content */
	  --muted: #666666;    /* secondary */
	}
	*{box-sizing:border-box;font-family:Segoe UI,Roboto,Arial,sans-serif}
	html,body{height:100%;margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
	/* make the credential block half the viewport width, but keep it responsive
	   with sensible min/max so it remains usable on small and very large screens */
	.center{width:50vw;max-width:700px;min-width:320px;min-height:60vh;margin:0;padding:36px;background:var(--card);border-radius:8px;box-shadow:0 8px 24px rgba(20,30,40,.08);display:flex;flex-direction:column;justify-content:center;position:relative}
	/* Make the top heading large and centered. Use clamp to keep it responsive:
	   approx 3x the original on desktop, but reduce on narrow viewports. */
	h1{margin:0 0 18px;font-size:clamp(32px,6.5vw,60px);color:var(--heading);text-align:center;font-weight:700}
	label{display:block;font-size:15px;color:var(--muted);margin-bottom:8px}
	/* center the form content inside the larger block */
	.form-inner{width:70%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
	input{width:100%;padding:16px 18px;margin-bottom:14px;border:1px solid rgba(0,0,0,0.08);border-radius:10px;background:#fff;color:var(--text);font-size:16px}
	/* large centered login button */
	.login-btn{background:var(--primary);color:#ffffff;border:none;padding:14px 20px;border-radius:10px;cursor:pointer;width:50%;min-width:220px;align-self:center;font-size:16px}
	/* register sits at the bottom-right of the block */
	.register-btn{position:absolute;right:24px;bottom:24px;background:transparent;border:none;color:var(--primary);text-decoration:none;padding:8px 12px;border-radius:6px}
	.muted{color:var(--muted);font-size:14px;margin-top:8px}

	/* Feedback styles */
	#msg{font-size:13px;margin-top:8px}
	#msg.error{color:var(--error)}
	#msg.success{color:var(--success)}
	#msg.info{color:var(--text)}
	</style>
</head>
<body>
	<main class="center">
		<h1>Login</h1>
		<form id="loginForm">
			<div class="form-inner">
				<label for="username">Username</label>
				<input id="username" name="username" required autocomplete="off" />
				<label for="password">Password</label>
				<input id="password" name="password" type="password" required autocomplete="off" />
				<button class="login-btn" type="submit">Login</button>
				<p id="msg" class="muted"></p>
			</div>
			<a class="register-btn" href="/register.html">Register</a>
		</form>
	</main>

	<script>
	const API_URL = 'https://steganography-detection-in-real-time.onrender.com';
	document.addEventListener('DOMContentLoaded', () => {
		const form = document.getElementById('loginForm');
		const msg = document.getElementById('msg');
		form.addEventListener('submit', async (e) => {
			e.preventDefault();
			const username = document.getElementById('username').value.trim();
			const password = document.getElementById('password').value;
			if (!username || !password) {
				msg.textContent = 'Please enter both username and password.';
				return;
			}
			try {
				msg.textContent = 'Logging in...';
				const response = await fetch(`${API_URL}/api/login`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ username, password })
				});
				const data = await response.json();
				if (response.ok) {
					localStorage.setItem('currentUser', username);
					localStorage.setItem('userInfo', JSON.stringify(data.user));
					msg.textContent = 'Login successful! Redirecting...';
					msg.className = 'success';
					setTimeout(() => { location.href = '/chat.html'; }, 500);
				} else {
					msg.textContent = data.detail || 'Login failed. Please try again.';
					msg.className = 'error';
				}
			} catch (error) {
				msg.textContent = 'Error connecting to server. Make sure the backend is running.';
				msg.className = 'error';
				console.error('Login error:', error);
			}
		});
	});
	</script>
</body>
</html>
