<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Register</title>
	<style>
	:root{--bg:#f4f6fb;--card:#fff;--accent:#0b76ff;--muted:#666}
	*{box-sizing:border-box;font-family:Segoe UI,Roboto,Arial,sans-serif}
	html,body{height:100%;margin:0;background:var(--bg)}
	.center{max-width:520px;margin:6vh auto;padding:20px;background:var(--card);border-radius:8px;box-shadow:0 6px 18px rgba(20,30,40,.06)}
	h1{margin:0 0 10px}
	label{display:block;margin-bottom:6px;color:var(--muted)}
	input{width:100%;padding:10px;border-radius:6px;border:1px solid #e9eef6;margin-bottom:12px}
	button{background:var(--accent);color:#fff;border:none;padding:8px 12px;border-radius:6px}
	.row{display:flex;gap:8px;align-items:center}
	.link{margin-left:auto;color:var(--accent);text-decoration:none}
	.muted{color:var(--muted);font-size:13px}
	</style>
</head>
<body>
	<main class="center">
		<h1>Register</h1>
		<form id="registerForm">
			<label for="username">Choose a username</label>
			<input id="username" name="username" required autocomplete="off" />
			<label for="email">Email</label>
			<input id="email" name="email" type="email" required autocomplete="off" />
			<label for="password">Password</label>
			<input id="password" name="password" type="password" required autocomplete="off" />
			<div class="row">
				<button type="submit">Register</button>
				<a class="link" href="/login.html">Back to login</a>
			</div>
			<p id="msg" class="muted"></p>
		</form>
		<section>
			<h3>Existing users</h3>
			<ul id="usersList" class="muted"></ul>
		</section>
	</main>

	<script>
	const API_URL = 'https://steganography-detection-in-real-time.onrender.com';
	document.addEventListener('DOMContentLoaded', () => {
		const form = document.getElementById('registerForm');
		const msg = document.getElementById('msg');
		const usersList = document.getElementById('usersList');

		async function refreshUsers() {
			try {
				const response = await fetch(`${API_URL}/api/users`);
				const data = await response.json();
				usersList.innerHTML = '';
				if (data.users && data.users.length > 0) {
					data.users.forEach(u => {
						const li = document.createElement('li');
						li.textContent = u.username;
						usersList.appendChild(li);
					});
				} else {
					usersList.innerHTML = '<li>No users registered yet</li>';
				}
			} catch (error) {
				usersList.innerHTML = '<li>Error loading users</li>';
				console.error('Error fetching users:', error);
			}
		}

		form.addEventListener('submit', async (e) => {
			e.preventDefault();
			const username = document.getElementById('username').value.trim();
			const email = document.getElementById('email').value.trim();
			const password = document.getElementById('password').value;
			if (!username || !email || !password) {
				msg.textContent = 'All fields are required';
				msg.style.color = 'red';
				return;
			}
			try {
				msg.textContent = 'Registering...';
				msg.style.color = 'black';
				const response = await fetch(`${API_URL}/api/register`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ username, email, password })
				});
				const data = await response.json();
				if (response.ok) {
					msg.textContent = 'Registered successfully! Redirecting to login...';
					msg.style.color = 'green';
					setTimeout(() => location.href = '/login.html', 800);
				} else {
					msg.textContent = data.detail || 'Registration failed. Please try again.';
					msg.style.color = 'red';
				}
			} catch (error) {
				msg.textContent = 'Error connecting to server. Make sure the backend is running.';
				msg.style.color = 'red';
				console.error('Registration error:', error);
			}
		});

		refreshUsers();
	});
	</script>
</body>
</html>
